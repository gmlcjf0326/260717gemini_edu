<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>20분 만에 이해하는 AI — 중1 제미나이 수업 교재</title>
<meta name="description" content="중학교 1학년 대상 제미나이(게스트 모드) 생성형 AI 리터러시 수업 패키지 — 20분 × 4회차 지도안·학습지·교사 키트 웹 교재">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>

<header class="topbar" id="topbar">
  <button class="icon-btn" id="btn-menu" aria-label="메뉴 열기" title="문서 목록">☰</button>
  <a class="brand" href="#/">
    <span class="brand-badge">AI</span>
    <span class="brand-text"><strong>20분 만에 이해하는 AI</strong><small>중1 제미나이 수업 교재</small></span>
  </a>
  <div class="topbar-actions">
    <button class="icon-btn" id="btn-search" aria-label="검색" title="검색 (단축키 /)">🔍</button>
    <button class="icon-btn" id="btn-timer" aria-label="수업 타이머" title="20분 수업 타이머">⏱</button>
    <button class="icon-btn hide-narrow" id="btn-font-down" aria-label="글자 작게" title="글자 작게">A−</button>
    <button class="icon-btn hide-narrow" id="btn-font-up" aria-label="글자 크게" title="글자 크게">A+</button>
    <button class="icon-btn" id="btn-theme" aria-label="화면 모드 전환" title="밝게/어둡게">🌓</button>
    <button class="icon-btn hide-narrow" id="btn-print" aria-label="현재 문서 인쇄" title="현재 문서 인쇄">🖨</button>
  </div>
</header>

<div class="layout">
  <nav id="sidebar" aria-label="문서 목록"></nav>
  <div id="backdrop"></div>
  <main id="main">
    <div class="print-header" aria-hidden="true">20분 만에 이해하는 AI — 중1 제미나이 수업 교재</div>
    <article id="content" class="doc"></article>
    <nav id="pager" class="pager"></nav>
    <footer class="site-footer">
      「20분 만에 이해하는 AI」 중1 제미나이 수업 콘텐츠 패키지 · 2026년 7월 기준 —
      AI 서비스 정책은 수시로 변경되므로 수업 전 실제 접속 화면과 공식 문서로 재확인하세요. 본 자료는 법률 자문이 아닙니다.
    </footer>
  </main>
  <aside id="toc" aria-label="문서 목차"></aside>
</div>

<!-- 20분 수업 타이머 -->
<section id="timer" class="timer hidden" aria-label="수업 타이머">
  <header class="timer-head">
    <strong>⏱ 20분 수업 타이머</strong>
    <span class="timer-head-btns">
      <button class="icon-btn" id="timer-min" title="접기">—</button>
      <button class="icon-btn" id="timer-close" title="닫기">✕</button>
    </span>
  </header>
  <div class="timer-body">
    <select id="timer-lesson" aria-label="차시 선택"></select>
    <div class="timer-clock" id="timer-clock">00:00</div>
    <div class="timer-phase">
      <div class="timer-phase-now" id="timer-phase-now">차시를 선택하고 시작을 누르세요</div>
      <div class="timer-phase-next" id="timer-phase-next"></div>
    </div>
    <div class="timer-track" id="timer-track" title="클릭하면 해당 시점으로 이동"></div>
    <div class="timer-btns">
      <button class="btn primary" id="timer-start">시작</button>
      <button class="btn" id="timer-reset">처음으로</button>
      <label class="timer-sound"><input type="checkbox" id="timer-sound" checked> 단계 전환 알림음</label>
    </div>
  </div>
</section>

<!-- 검색 -->
<div id="search-overlay" class="search-overlay hidden" role="dialog" aria-modal="true" aria-label="문서 검색">
  <div class="search-box">
    <div class="search-input-row">
      <input type="search" id="search-input" placeholder="전체 문서에서 검색 — 예: 세종대왕, 별명, 플랜 B, 레시피" autocomplete="off">
      <button class="icon-btn" id="search-close" aria-label="닫기">✕</button>
    </div>
    <div id="search-results" class="search-results"><p class="search-hint">두 글자 이상 입력하면 20개 문서 전체에서 찾아 드립니다.</p></div>
  </div>
</div>

<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
